name: Update mortgage rates

on:
  schedule:
    # Daily at 14:17 UTC. PMMS itself updates weekly (Thursdays); the commit
    # step below is a no-op when nothing changed.
    - cron: "17 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest PMMS rates from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FRED_API_KEY:-}" ]; then
            echo "::error::FRED_API_KEY secret is not set. See INSTRUCTIONS.md."
            exit 1
          fi
          fetch_series() {
            curl -sf "https://api.stlouisfed.org/fred/series/observations?series_id=$1&api_key=${FRED_API_KEY}&file_type=json&sort_order=desc&limit=5" \
              | jq -r '[.observations[] | select(.value != ".")][0] | "\(.date) \(.value)"'
          }
          read -r D30 R30 <<< "$(fetch_series MORTGAGE30US)"
          read -r D15 R15 <<< "$(fetch_series MORTGAGE15US)"
          jq -n \
            --arg updated "$(date -u +%F)" \
            --arg d30 "$D30" --argjson r30 "$R30" \
            --arg d15 "$D15" --argjson r15 "$R15" \
            '{
              updated: $updated,
              series: {
                MORTGAGE30US: { label: "30-yr fixed (US weekly avg)", rate: $r30, asOf: $d30 },
                MORTGAGE15US: { label: "15-yr fixed (US weekly avg)", rate: $r15, asOf: $d15 }
              }
            }' > data/rates.json
          cat data/rates.json

      - name: Commit if changed
        run: |
          set -euo pipefail
          # Ignore the "updated" stamp when deciding whether anything changed.
          if git diff --quiet -I '"updated"' -- data/rates.json; then
            echo "Rates unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git commit -m "Update mortgage benchmark rates"
          git push
